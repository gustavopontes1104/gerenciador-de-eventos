{% extends "base.html" %} {% block title %}Cadastrar Evento{% endblock %} {%
block content %}

<h1>Cadastrar Evento</h1>
<form method="POST" action="{{ url_for('cadastrar_evento') }}">
  <label>ID Evento: <input type="number" name="id_evento" required /></label
  ><br />
  <label>Nome: <input type="text" name="nome_evento" required /></label><br />
  <label>Categoria: <input type="text" name="categoria" required /></label
  ><br />
  <label>Data: <input type="date" name="data_evento" required /></label><br />
  <label>Local: <input type="text" name="local_evento" required /></label><br />
  <label
    >Capacidade:
    <input type="number" name="capacidade" min="1" required /></label
  ><br />
  <label
    >Valor do Ingresso:
    <input type="number" step="0.01" min="0" name="valor_ingresso" /></label
  ><br />
  <label>Responsável: <input type="text" name="responsavel" required /></label
  ><br />
  <label
    >Status:
    <select name="status">
      <option value="ATIVO">ATIVO</option>
      <option value="INATIVO">INATIVO</option>
    </select> </label
  ><br />
  <button type="submit">Cadastrar</button>
</form>

{% endblock %}
