{% extends "base.html" %} {% block title %}Editar Evento{% endblock %} {% block
content %}
<h1>Editar Evento</h1>
<form
  method="POST"
  action="{{ url_for('editar_evento', id_evento=evento[0]) }}"
>
  <label
    >Nome:
    <input
      type="text"
      name="nome_evento"
      value="{{ evento[1] }}"
      required
    /> </label
  ><br />
  <label
    >Categoria:
    <input
      type="text"
      name="categoria"
      value="{{ evento[2] }}"
      required
    /> </label
  ><br />
  <label
    >Data:
    <input
      type="date"
      name="data_evento"
      value="{{ evento[3] }}"
      required
    /> </label
  ><br />
  <label
    >Local:
    <input
      type="text"
      name="local_evento"
      value="{{ evento[4] }}"
      required
    /> </label
  ><br />
  <label
    >Capacidade:
    <input
      type="number"
      name="capacidade"
      value="{{ evento[5] }}"
      min="1"
      required
    /> </label
  ><br />
  <label
    >Valor do Ingresso:
    <input
      type="number"
      step="0.01"
      min="0"
      name="valor_ingresso"
      value="{{ evento[6] }}"
    /> </label
  ><br />
  <label
    >Responsável:
    <input
      type="text"
      name="responsavel"
      value="{{ evento[7] }}"
      required
    /> </label
  ><br />
  <label
    >Status:
    <select name="status">
      <option value="ATIVO" {% if evento[8]="" ="ATIVO" %}selected{% endif %}>
        ATIVO
      </option>
      <option
        value="INATIVO"
        {%
        if
        evento[8]=""
        ="INATIVO"
        %}selected{%
        endif
        %}
      >
        INATIVO
      </option>
    </select> </label
  ><br />
  <button type="submit">Salvar</button>
</form>

{% endblock %}
